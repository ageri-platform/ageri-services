name = "ageri-llm-gateway"
main = "index.ts"
compatibility_date = "2024-01-01"

# Routes
routes = [
  { pattern = "llm.ageri.ai/*", zone_name = "ageri.ai" }
]

# CF Workers AI binding
[ai]
binding = "AI"

# D1 — shared with billing worker (read subkeys + deduct credits)
[[d1_databases]]
binding = "DB"
database_name = "ageri-billing"
database_id = ""   # same DB as billing worker
