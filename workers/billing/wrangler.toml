name = "ageri-billing"
main = "index.ts"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "billing.ageri.ai/*", zone_name = "ageri.ai" }
]

# D1 — credit balances, subkeys, transactions
[[d1_databases]]
binding = "DB"
database_name = "ageri-billing"
database_id = "1f88dda1-548e-482b-920e-2ccecf8e3bd8"

# Secrets (set via: wrangler secret put <NAME>)
# PADDLE_WEBHOOK_SECRET
#
# VietQR secrets:
# VIETQR_BASE_URL          — https://api.vietqr.org (prod) or https://dev.vietqr.org (dev)
# VIETQR_USERNAME          — VietQR partner portal username
# VIETQR_PASSWORD          — VietQR partner portal password (base64-encoded)
# VIETQR_BANK_CODE         — e.g. MB
# VIETQR_BANK_ACCOUNT      — receiving account number
# VIETQR_BANK_NAME         — account holder name
# VIETQR_CALLBACK_USERNAME — credential you give VietQR for your token endpoint
# VIETQR_CALLBACK_PASSWORD — credential you give VietQR for your token endpoint
# VIETQR_JWT_SECRET        — min 32 chars, used to sign/verify callback JWTs
