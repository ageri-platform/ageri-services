name = "ageri-billing"
main = "index.ts"
compatibility_date = "2024-01-01"

# Routes
routes = [
  { pattern = "billing.ageri.ai/*", zone_name = "ageri.ai" }
]

# D1 — credit balances, subkeys, transactions
[[d1_databases]]
binding = "DB"
database_name = "ageri-billing"
database_id = ""   # fill after: wrangler d1 create ageri-billing

# Secrets (set via: wrangler secret put PADDLE_WEBHOOK_SECRET)
# PADDLE_WEBHOOK_SECRET
